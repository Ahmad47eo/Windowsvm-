name: APK Transformer 32 Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "apk-transformer-32/**"
      - ".github/workflows/apk-transformer-32-build.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: apk-transformer-32
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-transformer-32-debug-apk
          path: apk-transformer-32/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
